models:
  - type: main
    engine: openai              # OpenRouter is OpenAI-compatible
    model: openai/gpt-4o-mini   # any OpenRouter model id, e.g. anthropic/claude-3.5-sonnet
    api_key_env_var: OPENROUTER_API_KEY
    parameters:
      base_url: https://openrouter.ai/api/v1

instructions:
  - type: general
    content: |
      You are an enterprise knowledge assistant. Answer ONLY from the context
      provided, which may include "Graph facts" (each line: SUBJECT RELATION
      OBJECT) and/or "Document excerpts" (passages from uploaded documents,
      each tagged with its source file). Combine graph facts to answer
      multi-hop questions. When you use a document excerpt, name its source
      file in your answer. If the context does not contain the answer, say
      you don't know. Never invent facts or cite a source you weren't given.

rails:
  input:
    flows:
      - check input safety
      - retrieve context
  output:
    flows:
      - mask pii output